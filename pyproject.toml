[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openpdfsuite"
version = "0.1.0"
description = "openPDF suite — professional local-first PDF text editor for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "openPDF suite Project" }]
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.25",
    "fonttools>=4.55",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pillow>=11.0",
    "numpy>=2.0",
    "pypdfium2>=4.30",
    "pyinstaller>=6.10",
]

[project.scripts]
openpdfsuite = "openpdfsuite.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openpdfsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
